<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid Example</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUa0R6Y2gdvb8C+L0A2pQPa4hYxA0QV0GzRCsqPcJGxLtax/jD1gtgjw8S4J" crossorigin="anonymous">
</head>
<body>

<div class="container">
    <h1 class="text-center">Which Marvel Character Are You?</h1>

   
    <div class="row mb-3">
        <div class="col">
            <div class="bg-light border text-center p-3">
                <p>Iron Man</p>
                <img src="Iron-man.webp" alt="Iron Man" class="img-fluid mb-2">
            </div>
        </div>
        <div class="col">
            <div class="bg-light border text-center p-3">
                <p>Spider-Man</p>
                <img src="spider-man.jpg" alt="Spider-Man" class="img-fluid mb-2">
            </div>
        </div>
        <div class="col">
            <div class="bg-light border text-center p-3">
                 <p>Thor</p>
                <img src="Thor.jpeg" alt="Thor" class="img-fluid mb-2">
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <div class="bg-light border text-center p-3">
                <p>Hulk</p>
                <img src="Hulk.webp" alt="Hulk" class="img-fluid mb-2">
            </div>
        </div>
        <div class="col">
            <div class="bg-light border text-center p-3">
                <p>Black Widow</p>
                <img src="Black Widow.webp" alt="Black Widow" class="img-fluid mb-2">
            </div>
        </div>
        <div class="col">
            <div class="bg-light border text-center p-3">
                <p>Captain America</p>
                <img src="Capitan America.jpg" alt="Captain America" class="img-fluid mb-2">
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoB6V3qXQ5U5Ndu7z3z8mKpRM9EbTk0zB4aZg+F2Yp8x1p6" crossorigin="anonymous"></script>
</body>
</html>
