<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <!-- Title -->
      <h1 class="display-1 text-center text-danger mb-4">LOST CAT</h1>

      <!-- Carousel with cat pictures -->
      <div id="catCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://images.unsplash.com/photo-1574158622682-e40e69881006?w=400&h=300&fit=crop" class="d-block w-100" alt="Lost cat">
          </div>
          <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1519052537078-e6302a4968d4?w=400&h=300&fit=crop" class="d-block w-100" alt="Cat closeup">
          </div>
          <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1506755855726-665d9a6fff14?w=400&h=300&fit=crop" class="d-block w-100" alt="Cat playing">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#catCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#catCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>

      <!-- Description with border -->
      <div class="border border-3 border-danger p-4 mb-5 rounded">
        <h2 class="text-danger mb-3">Missing Since: February 17, 2026</h2>
        <p><strong>Name:</strong> Whiskers</p>
        <p><strong>Breed:</strong> Orange Tabby (Garfield)</p>
        <p><strong>Last Seen:</strong> Kitchen, stealing lasagna from the counter</p>
        <p class="lead">Please help bring Whiskers home, Reward Promised 🐱</p>
      </div>

      <!-- Form for tips -->
      <div class="mb-5">
        <h3 class="mb-4">Have you seen Whiskers?</h3>
        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your name">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="your@email.com">
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Your Tip</label>
            <textarea class="form-control" id="message" rows="3" placeholder="Where did you see Whiskers?"></textarea>
          </div>
        </form>
      </div>

      <!-- Buttons -->
      <div class="d-flex gap-3">
        <button type="button" class="btn btn-danger btn-lg">Submit Tip</button>
        <button type="button" class="btn btn-secondary btn-lg" disabled>Check Status</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
